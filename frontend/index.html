    <!--
      PANTALLA DE CARGA de la web pública. Se pinta con el HTML, antes de
      que descargue el JavaScript; la retira src/public-site/components/Precarga.jsx
      cuando fuentes, imágenes del hero y libro 3D están listos.
      Solo se activa en las rutas de PublicLayout (el panel no la ve).
    -->
    <script>
      (function () {
        var ruta = location.pathname.replace(/\/+$/, '') || '/';
        var publicas = ['/', '/catalogo', '/aplicacion', '/caracteristicas', '/nosotros', '/descargar'];
        if (publicas.indexOf(ruta) === -1) return;
        // Al recargar, siempre desde arriba. Por defecto el navegador devuelve
        // la página en la posición en la que se estaba, que no es lo que
        // queremos; se desactiva antes de que llegue a pintar.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        window.scrollTo(0, 0);
        var html = document.documentElement;
        html.setAttribute('data-precarga', '');
        html.classList.add('precarga-bloqueo');
        // Fuentes de la primera pantalla (texto, títulos, botones y pantalla de carga).
        [400, 600, 700].forEach(function (peso) {
          var f = document.createElement('link');
          f.rel = 'preload'; f.as = 'font'; f.type = 'font/woff2'; f.crossOrigin = 'anonymous';
          f.href = '/fonts/work-sans-latin-' + peso + '-normal.woff2';
          document.head.appendChild(f);
        });
        // Inicio: precargar la imagen del libro del hero (elemento LCP).
        if (ruta === '/') {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high';
          l.setAttribute('imagesrcset', '/hero/libro-3d-720.webp 720w, /hero/libro-3d-1200.webp 1200w');
          l.setAttribute('imagesizes', '(max-width: 1023px) 90vw, 55vw');
          document.head.appendChild(l);
        }
      })();
    </script>
    <style>
      /* Work Sans (web pública y pantalla de carga), autoalojada con nombre fijo
         para precargarla desde el HTML: así el texto no cambia de fuente al recargar. */
      @font-face { font-family: 'Work Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/work-sans-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Work Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/work-sans-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Work Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/work-sans-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Work Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/work-sans-latin-700-normal.woff2') format('woff2'); }
      #precarga { display: none; }
      html.precarga-bloqueo, html.precarga-bloqueo body { overflow: hidden; }
      html[data-precarga] body { background: #f6f3ee; }
      /* Pantalla de carga sobria: papel claro, el logo de la librería que
         respira despacio con un reflejo de luz, y el nombre debajo.
         Sin barras ni destellos. */
      html[data-precarga] #precarga {
        position: fixed; inset: 0; z-index: 2147483000;
        display: grid; place-items: center;
        color: #033a2c;
        font-family: 'Work Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: radial-gradient(70% 60% at 50% 42%, #ffffff 0%, #f6f3ee 60%, #ece6db 100%);
        transition: opacity 380ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #precarga.precarga--saliendo { opacity: 0; pointer-events: none; }
      .precarga__centro { display: grid; justify-items: center; text-align: center; padding: 24px; }
      .precarga__logo {
        position: relative; width: clamp(96px, 26vw, 128px); aspect-ratio: 320 / 377;
        animation: precarga-respirar 5s ease-in-out 0.9s infinite;
      }
      .precarga__logo { filter: drop-shadow(0 10px 18px rgba(3, 58, 44, 0.18)); }
      /* El logo llega en pedazos que se juntan hasta completarlo: cada pieza es
         el logo entero recortado a una región, que entra desde fuera. */
      .precarga__pieza {
        position: absolute; inset: 0; width: 100%; height: 100%;
        clip-path: var(--recorte);
        animation: precarga-unir 480ms cubic-bezier(0.2, 0.9, 0.25, 1) both;
        animation-delay: calc(40ms + var(--i) * 45ms);
      }
      /* Ya unido, el logo entero se superpone y borra las finas juntas de los cortes. */
      .precarga__entero { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; animation: precarga-sellar 160ms ease-out 0.7s forwards; }
      @keyframes precarga-sellar { to { opacity: 1; } }
      @keyframes precarga-unir {
        from { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(0.92); }
        60% { opacity: 1; }
        to { opacity: 1; transform: none; }
      }
      /* Reflejo que cruza el logo: recortado a su silueta. */
      .precarga__logo::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.45) 50%, transparent 62%) 0 0 / 260% 100% no-repeat;
        -webkit-mask: url('/precarga/logo-f-verde.webp') center / contain no-repeat;
        mask: url('/precarga/logo-f-verde.webp') center / contain no-repeat;
        animation: precarga-reflejo 3.2s ease-in-out 0.8s infinite;
      }
      @keyframes precarga-entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes precarga-respirar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes precarga-reflejo { 0% { background-position: 130% 0; } 60%, 100% { background-position: -30% 0; } }
      .precarga__nombre { margin: 22px 0 0; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.01em; animation: precarga-aparecer 500ms cubic-bezier(0.16, 1, 0.3, 1) 300ms both; }
      .precarga__frase { margin: 6px 0 0; font-size: 0.875rem; color: #5b6763; animation: precarga-aparecer 500ms cubic-bezier(0.16, 1, 0.3, 1) 400ms both; }
      @keyframes precarga-aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (max-width: 520px) {
        .precarga__nombre { font-size: 1.1875rem; }
        .precarga__frase { font-size: 0.8125rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .precarga__logo, .precarga__nombre, .precarga__frase { animation: precarga-aparecer-simple 400ms ease-out both; }
        .precarga__pieza { animation: none; }
        .precarga__entero { animation: none; opacity: 1; }
        .precarga__logo::after { display: none; }
        @keyframes precarga-aparecer-simple { from { opacity: 0; } to { opacity: 1; } }
      }
    </style>
  </head>
  <body>
    <div id="precarga" role="status" aria-live="polite" aria-busy="true">
      <div class="precarga__centro">
        <div class="precarga__logo" aria-hidden="true">
          <img class="precarga__pieza" data-src="/precarga/logo-f-verde.webp" alt="" width="320" height="377" decoding="async" style="--i: 0; --recorte: polygon(0 0, 55% 0, 45% 38%, 0 48%); --dx: -34px; --dy: -26px; --r: -14deg" />
          <img class="precarga__pieza" data-src="/precarga/logo-f-verde.webp" alt="" width="320" height="377" decoding="async" style="--i: 1; --recorte: polygon(55% 0, 100% 0, 100% 30%, 62% 42%, 45% 38%); --dx: 36px; --dy: -30px; --r: 12deg" />
          <img class="precarga__pieza" data-src="/precarga/logo-f-verde.webp" alt="" width="320" height="377" decoding="async" style="--i: 2; --recorte: polygon(0 48%, 45% 38%, 62% 42%, 52% 70%, 0 78%); --dx: -40px; --dy: 6px; --r: 9deg" />
          <img class="precarga__pieza" data-src="/precarga/logo-f-verde.webp" alt="" width="320" height="377" decoding="async" style="--i: 3; --recorte: polygon(62% 42%, 100% 30%, 100% 100%, 60% 100%, 52% 70%); --dx: 38px; --dy: 22px; --r: -10deg" />
          <img class="precarga__pieza" data-src="/precarga/logo-f-verde.webp" alt="" width="320" height="377" decoding="async" style="--i: 4; --recorte: polygon(0 78%, 52% 70%, 60% 100%, 0 100%); --dx: -22px; --dy: 34px; --r: 13deg" />
          <img class="precarga__entero" data-src="/precarga/logo-f-verde.webp" alt="" width="320" height="377" decoding="async" />
        </div>
        <p class="precarga__nombre">Librería del Saber</p>
        <p class="precarga__frase">Preparando tu experiencia de lectura...</p>
      </div>
    </div>
    <script>
      // Fuera de la web pública la pantalla de carga no se usa.
      // La imagen se pide solo en la web pública (el panel no la descarga).
      var precarga = document.getElementById('precarga');
      if (!document.documentElement.hasAttribute('data-precarga')) {
        if (precarga) precarga.remove();
      } else if (precarga) {
        precarga.querySelectorAll('img[data-src]').forEach(function (img) {
          img.src = img.getAttribute('data-src');
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
