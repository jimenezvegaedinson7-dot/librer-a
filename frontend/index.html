<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Las fuentes administrativas se solicitan solo al abrir el panel. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <title>MATIDANA Libros y Cultura · Delivery y recojo en Pallasca</title>
    <meta name="description" content="MATIDANA Libros y Cultura: explora el catálogo en la app, paga en línea con PayU y recibe tus libros con delivery dentro de Pallasca o recógelos sin costo en nuestra tienda de Pallasca, Áncash. Descarga la app para Android." />
    <link rel="canonical" href="https://libreria.my/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="MATIDANA Libros y Cultura" />
    <meta property="og:title" content="MATIDANA Libros y Cultura · Libros y anuncios" />
    <meta property="og:description" content="Catálogo en la app, pago con PayU, delivery dentro de Pallasca y recojo sin costo en Pallasca." />
    <meta property="og:url" content="https://libreria.my/" />
    <meta property="og:image" content="https://libreria.my/logo-principal.png" />
    <meta property="og:image:alt" content="Logo de MATIDANA Libros y Cultura" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MATIDANA Libros y Cultura" />
    <meta name="twitter:description" content="Catálogo en la app, pago con PayU, delivery dentro de Pallasca y recojo gratuito en Pallasca." />
    <meta name="twitter:image" content="https://libreria.my/logo-principal.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BookStore",
        "name": "MATIDANA Libros y Cultura",
        "url": "https://libreria.my/",
        "logo": "https://libreria.my/logo-principal.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Plaza de Armas, Jr. Marañón 161",
          "addressLocality": "Pallasca",
          "addressRegion": "Áncash",
          "postalCode": "02835",
          "addressCountry": "PE"
        },
        "areaServed": "Ciudad de Pallasca",
        "paymentAccepted": "PayU"
      }
    </script>

    <!-- Fuentes locales prioritarias, sin pantalla de carga bloqueante. -->
    <script>
      (function () {
        var ruta = location.pathname.replace(/\/+$/, '') || '/';
        var publicas = ['/', '/catalogo', '/aplicacion', '/caracteristicas', '/nosotros', '/descargar'];
        if (publicas.indexOf(ruta) === -1) return;
        // Al recargar, siempre desde arriba. Por defecto el navegador devuelve
        // la página en la posición en la que se estaba, que no es lo que
        // queremos; se desactiva antes de que llegue a pintar.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        window.scrollTo(0, 0);
        // El contenido aparece inmediatamente: fuentes e imágenes no bloquean
        // la navegación con una pantalla de carga.
        // Fuentes de la primera pantalla (texto, títulos y botones).
        [400, 600, 700].forEach(function (peso) {
          var f = document.createElement('link');
          f.rel = 'preload'; f.as = 'font'; f.type = 'font/woff2'; f.crossOrigin = 'anonymous';
          f.href = '/fonts/work-sans-latin-' + peso + '-normal.woff2';
          document.head.appendChild(f);
        });
      })();
    </script>
    <style>
      /* Work Sans (web pública), autoalojada con nombre fijo
         para precargarla desde el HTML: así el texto no cambia de fuente al recargar. */
      @font-face { font-family: 'Work Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/work-sans-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Work Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/work-sans-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Work Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/work-sans-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Work Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/work-sans-latin-700-normal.woff2') format('woff2'); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
