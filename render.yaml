# Configuración de despliegue en Render
# Conecta este repositorio en https://dashboard.render.com y selecciona "New > Blueprint"

services:
  # Backend API (Node.js/Express)
  - type: web
    name: libreria-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && node server.js
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://libreria-frontend.onrender.com,https://libreria-peach.vercel.app
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      # PayU Sandbox (prompt en dashboard de Render)
      - key: PAYU_ACCOUNT_ID
        sync: false
      - key: PAYU_MERCHANT_ID
        sync: false
      - key: PAYU_API_LOGIN
        sync: false
      - key: PAYU_API_KEY
        sync: false
      - key: PAYU_PUBLIC_KEY
        sync: false
      - key: PAYU_NOTIFICATION_URL
        sync: false
      - key: PAYU_TEST
        value: "true"
      # Email (configurar en dashboard)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_SECURE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false