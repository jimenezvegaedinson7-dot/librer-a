name: libreria_app
description: "Aplicación de clientes MATIDANA para catálogo y compras con PayU."

publish_to: 'none'

version: 1.0.33+34

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.0
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.1.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  webview_flutter: ^4.14.1
  audioplayers: ^6.8.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sonidos/
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-SourceSerif4.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSerif4-MediumItalic.ttf
          weight: 500
          style: italic

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon_legacy.png"
  adaptive_icon_background: "#F6F1E9"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
