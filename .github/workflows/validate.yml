name: Validación

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: libreria_db
      JWT_SECRET: ci-jwt-secret-not-for-production
      TWO_FACTOR_ENCRYPTION_KEY: ci-two-factor-key-not-for-production
      FRONTEND_ORIGINS: http://localhost:5173
      TRUST_PROXY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar backend
        working-directory: backend
        run: npm ci
      - name: Crear base de datos
        run: mysql --protocol=tcp -h 127.0.0.1 -uroot -proot < backend/database/schema.sql
      - name: Pruebas unitarias
        working-directory: backend
        run: npm test
      - name: Iniciar backend
        working-directory: backend
        run: npm start > /tmp/libreria-backend.log 2>&1 &
      - name: Esperar backend
        run: |
          for intento in {1..30}; do
            curl --fail --silent http://localhost:3000/api && exit 0
            sleep 1
          done
          cat /tmp/libreria-backend.log
          exit 1
      - name: Smoke HTTP
        working-directory: backend
        run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instalar dependencias Flutter
        working-directory: libreria_app
        run: flutter pub get
      - name: Analizar Flutter
        working-directory: libreria_app
        run: flutter analyze --no-fatal-infos
      - name: Probar Flutter
        working-directory: libreria_app
        run: flutter test
      - name: Construir APK debug
        working-directory: libreria_app
        run: flutter build apk --debug
